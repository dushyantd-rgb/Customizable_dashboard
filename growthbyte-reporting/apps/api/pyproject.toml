[project]
name = "growthbyte-reporting-api"
version = "0.1.0"
description = "FastAPI foundation for the GrowthByte Reporting Platform"
authors = [{ name = "GrowthByte" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=45.0.0,<46.0.0",
    "fastapi>=0.116.1,<0.117.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
ruff = "^0.12.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/matching/*.py" = ["E741"]  # Allow 'l' as variable name for lead records
"app/matching/router.py" = ["B008", "B904"]  # FastAPI Depends pattern
"tests/test_phase4_matching.py" = ["B017", "SIM105"]  # Test assertions
